                    const col = getCollection(item.collection);
                    return (
                      <div key={item.key} className="flex gap-4 border border-gold/12 p-3 bg-white relative" style={{ borderLeft:`3px solid ${col.accent}` }}>
                        <div className={`w-16 h-20 ${item.pat} flex-shrink-0 border border-gold/10`}/>
                        <div className="flex-grow flex flex-col justify-between">
                          <div>
                            <p className="text-[9px] uppercase font-sans font-bold" style={{ color: col.accent }}>{col.name}</p>
                            <h4 className="font-serif text-sm font-semibold text-forest">{item.name}</h4>
                            <p className="text-[10px] text-charcoal/45 font-sans mt-0.5">{item.fabric}</p>
                          </div>
                          <div className="flex items-center justify-between mt-2">
                            <div className="flex items-center border border-gold/15 text-[11px]">
                              <button onClick={() => updateQty(item.key,-1)} className="px-2 py-0.5 hover:text-forest">-</button>
                              <span className="px-2 py-0.5 font-bold font-sans">{item.quantity}</span>
                              <button onClick={() => updateQty(item.key, 1)} className="px-2 py-0.5 hover:text-forest">+</button>
                            </div>
                            <span className="font-sans text-xs font-bold text-charcoal">₹{(item.price*item.quantity).toLocaleString("en-IN")}</span>
                          </div>
                        </div>
                        <button onClick={() => removeFromCart(item.key)} className="absolute top-2 right-2 text-charcoal/35 hover:text-maroon text-base" aria-label="Remove">×</button>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
            {cart.length > 0 && (
              <div className="px-6 py-5 border-t border-gold/12">
                <div className="flex justify-between items-center mb-4">
                  <span className="font-serif text-forest font-semibold">Total</span>
                  <span className="font-sans text-lg font-bold text-forest">₹{cartTotal.toLocaleString("en-IN")}</span>
                </div>
                <p className="text-[9px] text-charcoal/35 font-sans mb-4">✦ Complimentary alterations included. Ships twice weekly from Rajasthan.</p>
                <button onClick={() => { triggerToast("Moving to checkout…"); setCart([]); setIsCartOpen(false); }} className="w-full bg-forest hover:bg-forest-deep text-cream py-3.5 text-[11px] font-bold uppercase tracking-widest font-sans transition-colors">Checkout</button>
              </div>
            )}
          </div>
        </div>
      )}

      {/* ══════════════════════════════════════════════════ WISHLIST ══ */}
      {isWishOpen && (
        <div className="fixed inset-0 z-50 flex justify-end bg-charcoal/60 backdrop-blur-sm fade-in">
          <div className="absolute inset-0 cursor-pointer" onClick={() => setIsWishOpen(false)}/>
          <div className="relative w-full max-w-md bg-cream h-full flex flex-col shadow-2xl border-l border-gold/15 z-10">
            <div className="flex justify-between items-center px-6 py-5 border-b border-gold/12">
              <h3 className="font-serif text-xl text-forest font-semibold">Wishlist ({wishlist.length})</h3>
              <button onClick={() => setIsWishOpen(false)} className="text-charcoal/45 hover:text-forest text-2xl" aria-label="Close">×</button>
            </div>
            <div className="flex-1 overflow-y-auto p-6">
              {wishlist.length === 0 ? (
                <div className="py-20 text-center"><span className="text-4xl">🕊</span><p className="font-serif italic text-forest/45 mt-4 text-sm">No dreams saved yet.</p></div>
              ) : (
                <div className="space-y-4">
                  {PRODUCTS.filter(p => wishlist.includes(p.id)).map(item => {
                    const col = getCollection(item.collection);
                    return (
                      <div key={item.id} className="flex gap-4 border border-gold/12 p-3 bg-white relative" style={{ borderLeft:`3px solid ${col.accent}` }}>
                        <div className={`w-16 h-20 ${item.pat} flex-shrink-0 border border-gold/10`}/>
                        <div className="flex-grow flex flex-col justify-between">
                          <div>
                            <p className="text-[9px] uppercase font-sans font-bold" style={{ color: col.accent }}>{col.name}</p>
                            <h4 className="font-serif text-sm font-semibold text-forest">{item.name}</h4>
                            <p className="text-[10px] text-charcoal/45 font-sans mt-0.5">{item.fabric}</p>
                          </div>
                          <div className="flex items-center justify-between mt-2">
                            <span className="font-sans text-xs font-bold text-charcoal">₹{item.price.toLocaleString("en-IN")}</span>
                            <button onClick={() => { addToCart(item); toggleWish(item.id); }} className="text-[9px] text-cream px-3 py-1 uppercase tracking-wider font-sans font-bold" style={{ background: col.accent }}>Add to Cart</button>
                          </div>
                        </div>
                        <button onClick={() => toggleWish(item.id)} className="absolute top-2 right-2 text-charcoal/35 hover:text-maroon text-base" aria-label="Remove">×</button>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* ══════════════════════════════════════════════════ QUICK LOOK ══ */}
      {quickLook && (() => {
        const col = getCollection(quickLook.collection);
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-charcoal/70 backdrop-blur-sm p-4 fade-in">
            <div className="absolute inset-0 cursor-pointer" onClick={() => setQuickLook(null)}/>
            <div className="relative w-full max-w-2xl bg-cream border shadow-2xl z-10 flex flex-col md:flex-row overflow-hidden" style={{ borderColor: col.accent + "50", borderTopWidth:3, borderTopColor: col.accent }}>
              <button onClick={() => setQuickLook(null)} className="absolute top-4 right-4 text-forest hover:text-maroon text-2xl font-bold z-20 leading-none" aria-label="Close">×</button>
              <div className={`w-full md:w-1/2 min-h-[260px] md:min-h-full ${quickLook.pat} relative`}>
                <div className="absolute bottom-3 left-3 text-[9px] uppercase tracking-widest font-bold px-2 py-0.5 border font-sans text-cream" style={{ background: col.accent + "CC", borderColor: col.accentLight + "40" }}>
                  {quickLook.fabric}
                </div>
                <div className="absolute top-3 right-3 text-[9px] uppercase tracking-widest font-bold px-2 py-0.5 font-sans border" style={{ color: col.accentLight, borderColor: col.accentLight + "50", background:"rgba(0,0,0,0.55)" }}>
                  {col.icon} {col.name}
                </div>
              </div>
              <div className="w-full md:w-1/2 p-8 flex flex-col justify-between">
                <div>
                  <p className="text-[10px] uppercase tracking-widest font-sans font-bold" style={{ color: col.accent }}>{quickLook.tag}</p>
                  <h3 className="font-display text-2xl text-forest mt-1">{quickLook.name}</h3>
                  <p className="font-sans text-xl font-bold text-charcoal mt-1">₹{quickLook.price.toLocaleString("en-IN")}</p>
                  <div className="w-8 h-px my-4" style={{ background: col.accent }}/>
                  <p className="font-serif italic text-sm text-forest/65 leading-relaxed">"{quickLook.desc}"</p>
                  <div className="mt-4 bg-cream-warm p-3 border border-gold/12 text-[11px] text-charcoal/65 font-sans space-y-1">
                    <p><strong>Fabric:</strong> {quickLook.fabric}</p>
                    <p><strong>Care:</strong> {quickLook.specs}</p>
                  </div>
                </div>
                <div className="flex gap-3 mt-6">
                  <button onClick={() => { addToCart(quickLook); setQuickLook(null); }} className="flex-1 text-cream py-3 text-[11px] uppercase tracking-widest font-sans font-bold transition-colors" style={{ background: col.accent }}>
                    Add to Cart
                  </button>
                  <button onClick={() => toggleWish(quickLook.id)} className="p-3 border transition-colors" style={{ borderColor: wishlist.includes(quickLook.id) ? col.accent : "rgba(201,168,76,0.25)", background: wishlist.includes(quickLook.id) ? col.accent + "15" : "transparent", color: wishlist.includes(quickLook.id) ? col.accent : "rgba(28,26,24,0.4)" }} aria-label="Wishlist">
                    <svg className="w-4 h-4" fill={wishlist.includes(quickLook.id) ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      })()}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
