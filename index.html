<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISHARA | Weave Your Story</title>
  <meta name="description" content="Ishara — handcrafted ethnic apparel weaving ancient Indian stories into every thread. Discover hand-stitched suits, silk sarees and artisan block prints.">
  <meta name="keywords" content="ISHARA, ethnic wear, Indian traditional, hand-stitched, mulmul, silk, cotton, sustainable fashion, artisan, karigar">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Jost:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&family=Great+Vibes&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest:   '#1B3A2D',
            'forest-deep': '#0F2318',
            'forest-light': '#2D5A42',
            gold:     '#C9A84C',
            'gold-light': '#E5C97A',
            'gold-pale':  '#F5E8C0',
            maroon:   '#6B1A2A',
            'maroon-deep': '#4A0F1C',
            cream:    '#F8F3EA',
            'cream-warm': '#F0E8D5',
            charcoal: '#1C1A18',
          },
          fontFamily: {
            serif:   ['"Cormorant Garamond"', 'serif'],
            display: ['"DM Serif Display"', 'serif'],

  <!-- React CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #F8F3EA; }
    ::-webkit-scrollbar-thumb { background: #1B3A2D; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #C9A84C; }
    ::selection { background: #C9A84C33; color: #1B3A2D; }

    /* ─── Base ─── */
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    /* ─── Grain texture overlay ─── */
    .grain::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      opacity: 0.028;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat: repeat;
    }

    /* ─── Logo SVG colours ─── */
    .logo-svg .lotus { fill: #C9A84C; }
    .logo-svg .knot  { fill: #C9A84C; }
    .logo-svg .hindi { fill: #1B3A2D; }
    .logo-svg .latin { fill: #C9A84C; }

    /* ─── Animations ─── */
    @keyframes fadeUp   { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeIn   { from { opacity:0; } to { opacity:1; } }
    @keyframes float    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    @keyframes shimmer  {
      0%   { background-position: -200% center; }
      100% { background-position:  200% center; }
    }
    @keyframes marquee  { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
    @keyframes spin-slow{ from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes revealX  { from{width:100%} to{width:0} }
    @keyframes borderPulse { 0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,0)} 50%{box-shadow:0 0 0 6px rgba(201,168,76,0.18)} }

    .fade-up   { animation: fadeUp  0.75s cubic-bezier(.16,1,.3,1) both; }
    .fade-in   { animation: fadeIn  0.6s ease both; }
    .float-anim{ animation: float   5s ease-in-out infinite; }
    .marquee-inner { animation: marquee 30s linear infinite; display:inline-flex; white-space:nowrap; }
    .marquee-wrap:hover .marquee-inner { animation-play-state:paused; }

    /* Gold shimmer text */
    .shimmer-gold {
      background: linear-gradient(90deg, #C9A84C 0%, #F5E8C0 40%, #E5C97A 60%, #C9A84C 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s linear infinite;
    }

    /* Card hover lift */
    .card-lift {
      transition: transform .4s cubic-bezier(.25,1,.5,1), box-shadow .4s ease;
    }
    .card-lift:hover {
      transform: translateY(-10px);
      box-shadow: 0 24px 48px -8px rgba(27,58,45,0.18);
    }

    /* Gold border pulse on focus */
    .gold-pulse:focus-within { animation: borderPulse 1.5s ease infinite; }

    /* Staggered delays */
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.35s; }
    .delay-4 { animation-delay: 0.5s; }

    /* Hero diagonal split */
    .hero-bg {
      background: linear-gradient(135deg, #0F2318 0%, #1B3A2D 40%, #2D2012 70%, #4A0F1C 100%);
    }

    /* Section backgrounds */
    .bg-cream-texture {
      background-color: #F8F3EA;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23C9A84C' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    /* Patterns for product cards */
    .pat-1 {
      background: radial-gradient(ellipse at 30% 70%, #2D5A42 0%, #1B3A2D 60%),
                  repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(201,168,76,0.12) 10px, rgba(201,168,76,0.12) 12px);
    }
    .pat-2 {
      background: linear-gradient(135deg, #4A0F1C 0%, #6B1A2A 50%, #2D0A13 100%);
      background-image: radial-gradient(circle at 50% 50%, rgba(201,168,76,0.15) 0%, transparent 60%),
                        repeating-conic-gradient(rgba(201,168,76,0.06) 0deg 10deg, transparent 10deg 20deg);
    }
    .pat-3 {
      background: linear-gradient(160deg, #2D2012 0%, #3D2F18 100%);
      background-image: repeating-linear-gradient(90deg, rgba(201,168,76,0.1) 0px, rgba(201,168,76,0.1) 1px, transparent 1px, transparent 20px),
                        repeating-linear-gradient(0deg, rgba(201,168,76,0.1) 0px, rgba(201,168,76,0.1) 1px, transparent 1px, transparent 20px);
    }
    .pat-4 {
      background: conic-gradient(from 45deg, #1B3A2D 0%, #2D5A42 25%, #1B3A2D 50%, #0F2318 75%, #1B3A2D 100%);
    }
    .pat-5 {
      background: linear-gradient(135deg, #2D0A13, #4A0F1C 40%, #6B1A2A 70%, #4A0F1C 100%);
      background-image: radial-gradient(circle at 20% 80%, rgba(201,168,76,0.2) 0%, transparent 40%),
                        radial-gradient(circle at 80% 20%, rgba(201,168,76,0.15) 0%, transparent 40%);
    }
    .pat-6 {
      background: linear-gradient(135deg, #1a1408 0%, #2D2012 50%, #3D2F18 100%);
      background-image: repeating-radial-gradient(circle at 50% 50%, rgba(201,168,76,0.08) 0%, rgba(201,168,76,0.08) 5px, transparent 5px, transparent 20px);
    }
    .pat-7 { background: linear-gradient(160deg, #0F2318, #1B3A2D 50%, #2D3A18 100%); }
    .pat-8 { background: linear-gradient(135deg, #3D0F1C 0%, #6B1A2A 60%, #4A0F1C 100%); }

    /* Nav link underline anim */
    .nav-link {
      position: relative;
    }
    .nav-link::after {
      content:'';
      position:absolute;
      bottom:-3px;
      left:0;
      width:0;
      height:1px;
      background:#C9A84C;
      transition:width .3s ease;
    }
    .nav-link:hover::after { width:100%; }

    /* Ornament divider */
    .ornament {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #C9A84C;
    }
    .ornament::before, .ornament::after {
      content:'';
      flex:1;
      height:1px;
      background: linear-gradient(90deg, transparent, #C9A84C55, #C9A84C, #C9A84C55, transparent);
    }

    /* Bordered box */
    .heritage-border {
      position: relative;
    }
    .heritage-border::before {
      content:'';
      position:absolute;
      inset:8px;
      border:1px solid rgba(201,168,76,0.2);
      pointer-events:none;
    }

    /* Scroll indicator */
    @keyframes scrollBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(6px)} }
    .scroll-bounce { animation: scrollBounce 1.6s ease-in-out infinite; }
  </style>
</head>

<body class="grain bg-cream text-charcoal font-sans overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ── Data ──────────────────────────────────────────────────────────────
    const PRODUCTS = [
      { id:1, name:"The Saraswati Suit",      category:"Mulmul Suits",         price:4800,  fabric:"Pure Mulmul",        tag:"Classic Hand-Painted",  pat:"pat-1", desc:"Cream mulmul cotton with hand-painted gold swan motifs and custom lace borders.", specs:"100% organic cotton, handmade block accents, hand-wash only.", popular:true  },
      { id:2, name:"Devi Temple Anarkali",     category:"Silk Suits",           price:8500,  fabric:"Kora Silk",           tag:"Karigar Embroidered",   pat:"pat-2", desc:"Deep maroon silk suit with borders inspired by ancient Rajasthani temple walls.",  specs:"Pure silk base, real metallic zari threads, dry clean only.", popular:true  },
      { id:3, name:"Kamadhenu Block Saree",    category:"Silk Suits",           price:12000, fabric:"Pure Tussar Silk",    tag:"Sacred Cow Prints",     pat:"pat-3", desc:"Earthy olive green saree depicting the wish-granting cow, framed in red borders.", specs:"5.5 metres, hand-loomed in Bengal, includes blouse piece.", popular:false },
      { id:4, name:"Mayura Indigo Co-ord",     category:"Coord Sets",           price:3600,  fabric:"Slub Cotton",         tag:"Peacock Block Prints",  pat:"pat-4", desc:"Comfort-fit high neck coord set with deep indigo dyes and peacock patterns.",       specs:"Breathable heavy cotton, pocket details, standard fit.", popular:true  },
      { id:5, name:"Dusk Haveli Suit",         category:"Hand-Stitched Suits",  price:5400,  fabric:"Desert Khadi Cotton", tag:"100% Hand-Tailored",    pat:"pat-5", desc:"Earthy ochre tunic and structured pants, hand-tailored by master craftsmen.",       specs:"Hand-spun khadi yarn, natural clay dyes, signature brass buttons.", popular:false },
      { id:6, name:"Vasant Lotus Choga",       category:"Mulmul Suits",         price:6800,  fabric:"Chanderi Silk-Mulmul",tag:"Golden Lotus Embellished",pat:"pat-6",desc:"Light gold choga with detailed lotus mandalas and sheer bell sleeves.",             specs:"Silk-Mulmul blend, gota patti work on yoke, comes with slip.", popular:false },
      { id:7, name:"Meghdoot Rain Suit",       category:"Cotton Suits",         price:4200,  fabric:"Premium Mul Cotton",  tag:"Hand-Block Print",      pat:"pat-7", desc:"Cloud-grey suit set inspired by rain-clouds of Kalidasa's poetry.",                specs:"Super-soft lining, includes mulmul dupatta, relaxed fit.", popular:false },
      { id:8, name:"Yashoda Festive Kurta",    category:"Hand-Stitched Suits",  price:6200,  fabric:"Linen-Silk Blend",    tag:"Traditional Zardozi",   pat:"pat-8", desc:"A celebration of hand-crafted zardozi along the collar, in rich vermilion.",       specs:"Silk linen weave, micro-beading, relaxed tailored fit.", popular:true  },
    ];

    const PRINTS = [
      { icon:"🦢", title:"Swan of Saraswati",   desc:"A symbol of discrimination and beauty, swimming through cosmic rivers of ancient wisdom.", pat:"pat-1" },
      { icon:"🌸", title:"Lotus Mandala",        desc:"Petals unfolding at dawn, representing purity rising from ancient sacred waters.",          pat:"pat-6" },
      { icon:"🦚", title:"Peacock in the Rain",  desc:"Wild joy under thunderous skies, hand-carved block stamps on rich indigo fabrics.",          pat:"pat-4" },
      { icon:"🐄", title:"Kamadhenu's Grace",    desc:"The celestial cow, rendering abundance and warmth across handwoven Bengal fabric.",          pat:"pat-3" },
      { icon:"🙏", title:"The Warrior Goddess",  desc:"Brave protective lines drawn from traditional folk talismans and temple friezes.",            pat:"pat-2" },
    ];

    const CATS = ["All","Cotton Suits","Silk Suits","Mulmul Suits","Hand-Stitched Suits","Coord Sets"];

    // ── Logo Component (SVG recreation of brand logo) ─────────────────────
    function IsharaLogo({ size = "md", forNav = false }) {
      const scales = { sm:"w-28", md:"w-40", lg:"w-56", xl:"w-72" };
      return (
        <div className={`${scales[size]} flex-shrink-0`}>
          <svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" className="w-full h-auto">
            {/* ── Lotus top ── */}
            <g transform="translate(160,0)">
              {/* Needle */}
              <line x1="55" y1="48" x2="68" y2="68" stroke="#C9A84C" strokeWidth="1.5" strokeLinecap="round"/>
              <ellipse cx="68.5" cy="70" rx="2" ry="3.5" fill="#C9A84C" transform="rotate(35,68.5,70)"/>
              {/* Thread loop */}
              <path d="M46,52 C52,44 60,46 58,54 C56,60 48,58 46,52 Z" fill="none" stroke="#C9A84C" strokeWidth="1.2"/>
              {/* Knot / weave diamond */}
              <path d="M-4,52 L10,42 L24,52 L10,62 Z M-4,52 L10,62 L24,52 M10,42 L10,62" fill="none" stroke="#C9A84C" strokeWidth="1.4" strokeLinejoin="round"/>
              <line x1="0" y1="47" x2="20" y2="57" stroke="#C9A84C" strokeWidth="0.8"/>
              <line x1="20" y1="47" x2="0" y2="57" stroke="#C9A84C" strokeWidth="0.8"/>
              {/* Centre lotus petals */}
              <path d="M0,40 C-6,30 -10,18 0,10 C10,18 6,30 0,40 Z" fill="#C9A84C"/>
              <path d="M0,40 C-12,34 -20,22 -14,12 C-6,20 -4,32 0,40 Z" fill="#C9A84C" opacity="0.85"/>
              <path d="M0,40 C12,34 20,22 14,12 C6,20 4,32 0,40 Z" fill="#C9A84C" opacity="0.85"/>
              <path d="M0,40 C-18,36 -24,26 -20,16 C-12,24 -8,34 0,40 Z" fill="#C9A84C" opacity="0.6"/>
              <path d="M0,40 C18,36 24,26 20,16 C12,24 8,34 0,40 Z" fill="#C9A84C" opacity="0.6"/>
              {/* Connecting curve down */}
              <path d="M-20,56 C-10,62 10,62 20,56" fill="none" stroke="#C9A84C" strokeWidth="1.2"/>
            </g>
            {/* ── "इश" Devanagari in forest green ── */}
            <text x="60" y="130" fontFamily="serif" fontSize="64" fontWeight="700" fill="#1B3A2D" letterSpacing="-1">इश</text>
            {/* ── "ara" latin script in gold ── */}
            <text x="178" y="128" fontFamily="'Great Vibes', cursive" fontSize="52" fill="#C9A84C">ara</text>
            {/* ── Needle after "ara" ── */}
            <line x1="248" y1="100" x2="260" y2="130" stroke="#C9A84C" strokeWidth="1.5" strokeLinecap="round"/>
            <ellipse cx="260" cy="132" rx="2" ry="4" fill="#C9A84C"/>
            <path d="M244,118 C250,112 256,116 253,124" fill="none" stroke="#C9A84C" strokeWidth="1.2"/>
            {/* ── "weave your story" tagline ── */}
            <text x="160" y="163" fontFamily="'Great Vibes', cursive" fontSize="22" fill="#C9A84C" textAnchor="middle">— weave your story —</text>
          </svg>
        </div>
      );
    }

    // ── Toast ─────────────────────────────────────────────────────────────
    function Toast({ message }) {
      return (
        <div className="fixed bottom-6 right-6 z-[999] bg-forest text-cream border-l-4 border-gold px-6 py-4 shadow-2xl fade-in flex items-center gap-3 max-w-xs">
          <span className="text-gold text-lg">✦</span>
          <p className="font-serif text-sm tracking-wide leading-snug">{message}</p>
        </div>
      );
    }

    // ── Section Label ─────────────────────────────────────────────────────
    function SectionLabel({ text, light = false }) {
      return (
        <div className="ornament mb-3">
          <span className={`text-[10px] uppercase font-sans font-semibold tracking-[0.35em] ${light ? "text-gold-pale" : "text-gold"} whitespace-nowrap`}>
            {text}
          </span>
        </div>
      );
    }

    // ── Product Card ──────────────────────────────────────────────────────
    function ProductCard({ product, onAddCart, onWishlist, isWishlisted, onQuickLook }) {
      return (
        <div className={`relative flex flex-col bg-cream border border-gold/20 card-lift group cursor-pointer`}>
          {/* Image / Pattern area */}
          <div className="relative overflow-hidden aspect-[3/4] border-b border-gold/10" onClick={() => onQuickLook(product)}>
            <div className={`w-full h-full ${product.pat} transition-transform duration-700 group-hover:scale-105`} />
            {/* Fabric badge */}
            <div className="absolute top-3 left-3 bg-forest text-gold-light text-[9px] uppercase font-sans font-bold px-2.5 py-1 tracking-wider">
              {product.fabric}
            </div>
            {/* Popular badge */}
            {product.popular && (
              <div className="absolute top-3 right-3 bg-gold text-forest-deep text-[9px] uppercase font-sans font-bold px-2 py-0.5">
                Loved
              </div>
            )}
            {/* Quick look overlay */}
            <div className="absolute inset-0 bg-forest/70 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
              <span className="bg-gold text-forest-deep px-5 py-2 text-[11px] uppercase tracking-widest font-sans font-bold">
                Quick Look
              </span>
            </div>
          </div>

          {/* Info */}
          <div className="p-4 flex flex-col gap-3">
            <div>
              <p className="text-[10px] uppercase tracking-widest text-forest/60 font-sans font-medium">{product.tag}</p>
              <h3 className="font-serif text-base font-semibold text-forest mt-0.5 leading-tight">{product.name}</h3>
            </div>
            <div className="flex items-center justify-between pt-2 border-t border-gold/15">
              <span className="font-sans text-sm font-bold text-charcoal">₹{product.price.toLocaleString("en-IN")}</span>
              <div className="flex gap-2">
                <button
                  onClick={() => onWishlist(product.id)}
                  className={`p-2 border transition-colors ${isWishlisted ? "border-gold bg-gold/10 text-gold" : "border-gold/30 text-charcoal/60 hover:border-gold hover:text-gold"}`}
                  aria-label="Wishlist"
                >
                  <svg className="w-3.5 h-3.5" fill={isWishlisted ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                  </svg>
                </button>
                <button
                  onClick={() => onAddCart(product)}
                  className="bg-forest hover:bg-forest-deep text-cream text-[10px] uppercase tracking-widest font-sans font-bold px-4 py-2 transition-colors"
                >
                  Add
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── Main App ──────────────────────────────────────────────────────────
    function App() {
      const [cart, setCart]                   = useState([]);
      const [wishlist, setWishlist]           = useState([]);
      const [isCartOpen, setIsCartOpen]       = useState(false);
      const [isWishOpen, setIsWishOpen]       = useState(false);
      const [isSearchOpen, setIsSearchOpen]   = useState(false);
      const [searchQuery, setSearchQuery]     = useState("");
      const [selectedCat, setSelectedCat]     = useState("All");
      const [quickLook, setQuickLook]         = useState(null);
      const [toast, setToast]                 = useState(null);
      const [scrolled, setScrolled]           = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // Quiz
      const [quizStep, setQuizStep]   = useState(1);
      const [quizAns, setQuizAns]     = useState({});
      const [quizDone, setQuizDone]   = useState(false);

      // Custom form
      const [customForm, setCustomForm]     = useState({ name:"", contact:"", detail:"", option:"Choose Your Neckline" });
      const [customSuccess, setCustomSuccess] = useState(false);

      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 50);
        window.addEventListener("scroll", onScroll);
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      const triggerToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3200);
      };

      const addToCart = (product, size = "Standard") => {
        const key = `${product.id}-${size}`;
        setCart(prev => {
          const ex = prev.find(i => i.key === key);
          if (ex) return prev.map(i => i.key === key ? { ...i, quantity: i.quantity + 1 } : i);
          return [...prev, { ...product, size, quantity: 1, key }];
        });
        triggerToast(`${product.name} added to your circle.`);
      };

      const removeFromCart = (key) => {
        setCart(prev => prev.filter(i => i.key !== key));
      };

      const updateQty = (key, delta) => {
        setCart(prev => prev.map(i => i.key === key ? { ...i, quantity: Math.max(1, i.quantity + delta) } : i));
      };

      const toggleWish = (id) => {
        setWishlist(prev => {
          if (prev.includes(id)) { triggerToast("Removed from wishlist."); return prev.filter(x => x !== id); }
          triggerToast("Added to wishlist."); return [...prev, id];
        });
      };

      const filteredProducts = PRODUCTS.filter(p => {
        const catOk = selectedCat === "All" || p.category === selectedCat;
        const searchOk = !searchQuery || p.name.toLowerCase().includes(searchQuery.toLowerCase()) || p.fabric.toLowerCase().includes(searchQuery.toLowerCase());
        return catOk && searchOk;
      });

                    <h3 className="font-serif text-3xl text-forest mt-4 mb-2">The Loom Has Answered</h3>
                    <div className="my-6 max-w-sm mx-auto p-5 bg-cream/70 border border-gold/25">
                      <p className="text-[10px] uppercase tracking-widest text-forest/50 font-sans font-bold">Recommended Fabric</p>
                      <h4 className="font-display text-2xl text-gold mt-1">{getQuizRec().fabric}</h4>
                      <div className="w-10 h-px bg-gold mx-auto my-3"/>
                      <p className="text-xs text-charcoal/70 font-sans leading-relaxed">
                        For <strong className="text-forest">"{quizAns.step1}"</strong>, feeling{" "}
                        <strong className="text-forest">"{quizAns.step2}"</strong>, dressed for your{" "}
                        <strong className="text-forest">"{quizAns.step3}"</strong> build.
                      </p>
                    </div>

                    <h4 className="font-sans text-[10px] uppercase tracking-widest text-forest font-bold mb-4">Matches Selected For You</h4>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-8 text-left">
                      {getQuizRec().matches.slice(0,3).map(item => (
                        <div key={item.id} className="border border-gold/20 p-2 bg-cream">
                          <div className={`h-24 ${item.pat} border border-gold/10`}/>
                          <div className="mt-2">
                            <p className="font-serif text-xs text-forest font-semibold truncate">{item.name}</p>
                            <div className="flex justify-between items-center mt-1">
                              <span className="text-[10px] text-gold font-bold font-sans">₹{item.price.toLocaleString("en-IN")}</span>
                              <button onClick={() => addToCart(item, quizAns.step3 || "Standard")} className="text-[9px] bg-forest text-cream px-2 py-1 uppercase tracking-wider font-sans font-bold hover:bg-forest-deep">
                                Add
                              </button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                    <button onClick={() => { setQuizDone(false); setQuizStep(1); setQuizAns({}); }} className="text-[10px] uppercase tracking-widest text-forest/60 border-b border-forest/30 font-sans font-semibold hover:text-forest">
                      Start Again
                    </button>
                  </div>
                )}
              </div>
            </div>
          </section>

          {/* ══════════════════════════════════════════════════════════
              7. CUSTOMISATION
          ══════════════════════════════════════════════════════════ */}
          <section id="customise" className="bg-forest py-20 lg:py-28 relative overflow-hidden">
            <div className="absolute inset-0 opacity-5" style={{backgroundImage:"radial-gradient(circle, #C9A84C 1.5px, transparent 1.5px)", backgroundSize:"30px 30px"}}/>
            <div className="max-w-5xl mx-auto px-6 lg:px-10 relative z-10">
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                {/* Left */}
                <div>
                  <SectionLabel text="Karigar Alteration" light />
                  <h2 className="font-display text-4xl text-cream mt-3 leading-tight">Every Ishara piece can be yours — <span className="shimmer-gold">truly.</span></h2>
                  <div className="w-12 h-px bg-gold/50 my-6"/>
                  <p className="font-serif italic text-cream/70 text-base leading-relaxed">
                    "No garment should constrain the story of the wearer. Share your measurements or request customised cuts. Our karigars will tailor pieces to your whisper."
                  </p>
                  <p className="text-[11px] font-sans text-gold/70 mt-5 tracking-wide">
                    ✦ Alterations and custom dimensions are completed at no extra fee.
                  </p>
                </div>

                {/* Right: Form */}
                <div className="bg-cream border border-gold/20 p-8 shadow-2xl">
                  {customSuccess ? (
                    <div className="py-12 text-center fade-in">
                      <span className="text-4xl">✂️</span>
                      <h4 className="font-serif text-xl font-bold text-forest mt-4 mb-2">Request Received</h4>
                      <p className="font-serif italic text-forest/60 text-sm">
                        "We have taken your measures to heart. An artisan will reach out shortly."
                      </p>
                    </div>
                  ) : (
                    <form onSubmit={handleCustomSubmit} className="space-y-4">
                      <div className="grid grid-cols-3 gap-2">
                        {["Choose Your Neckline","Request a Colour","Custom Measurements"].map(opt => (
                          <button type="button" key={opt} onClick={() => setCustomForm(f => ({...f, option: opt}))}
                            className={`py-2 text-[9px] uppercase font-bold tracking-widest border transition-all font-sans ${
                              customForm.option === opt ? "bg-forest border-forest text-cream" : "border-gold/30 text-charcoal/60 hover:border-forest/50"
                            }`}>
                            {opt}
                          </button>
                        ))}
                      </div>

                      {[
                        { label:"Your Name", key:"name", type:"text", placeholder:"e.g. Arundhati Roy" },
                        { label:"WhatsApp / Phone", key:"contact", type:"text", placeholder:"e.g. +91 98765 43210" },
                      ].map(f => (
                        <div key={f.key}>
                          <label className="block text-[10px] uppercase font-bold tracking-wider text-forest/70 mb-1 font-sans">{f.label}</label>
                          <input type={f.type} required value={customForm[f.key]} placeholder={f.placeholder}
                            onChange={e => setCustomForm(c => ({...c, [f.key]: e.target.value}))}
                            className="w-full bg-cream-warm border border-gold/30 px-3 py-2.5 text-xs outline-none focus:border-forest font-sans"/>
                        </div>
                      ))}

                      <div>
                        <label className="block text-[10px] uppercase font-bold tracking-wider text-forest/70 mb-1 font-sans">Customisation Details</label>
                        <textarea rows="3" value={customForm.detail} onChange={e => setCustomForm(c => ({...c, detail:e.target.value}))}
                          placeholder="Describe your customisation request…"
                          className="w-full bg-cream-warm border border-gold/30 px-3 py-2.5 text-xs outline-none focus:border-forest font-sans resize-none"/>
                      </div>

                      <button type="submit" className="w-full bg-forest hover:bg-forest-deep text-cream py-3.5 text-[11px] font-bold uppercase tracking-widest font-sans transition-colors shadow-md">
                        Send Your Ishara Request
                      </button>
                    </form>
                  )}
                </div>
              </div>
            </div>
          </section>

          {/* ══════════════════════════════════════════════════════════
              8. ABOUT — The Hands Behind Ishara
          ══════════════════════════════════════════════════════════ */}
          <section className="bg-cream-texture py-20 lg:py-28 border-t border-gold/10">
            <div className="max-w-6xl mx-auto px-6 lg:px-10 grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-20 items-center">
              {/* Left visual */}
              <div className="relative">
                <div className="absolute inset-0 border border-gold/20 translate-x-4 translate-y-4 pointer-events-none"/>
                <div className="aspect-[4/3] pat-3 border border-gold/20 relative flex flex-col justify-end p-6">
                  <div className="bg-forest/95 border-l-2 border-gold p-4 max-w-xs">
                    <p className="font-serif italic text-cream/80 text-xs leading-relaxed">
                      "Hands dye the fabrics in large copper vats, under the open sun of Jaipur."
                    </p>
                  </div>
                </div>
              </div>

              {/* Right text */}
              <div>
                <SectionLabel text="Our Origins" />
                <h2 className="font-display text-3xl md:text-4xl text-forest mt-2 leading-tight">The Hands Behind Ishara</h2>
                <p className="font-serif italic text-lg text-forest/70 leading-relaxed mt-6">
                  "Ishara was born in a room full of thread and sunlight. We are not a factory. We are a circle of hands — karigars, painters, weavers — who believe that a garment should carry memory."
                </p>
                <p className="font-sans text-xs text-charcoal/60 leading-relaxed mt-4 tracking-wide">
                  Our pieces are built locally, supporting weavers across Bengal, Rajasthan, and Madhya Pradesh. Each pattern is stamped using organic dye pigments extracted from clay, madder roots, indigo, and marigold flowers.
                </p>
              </div>
            </div>
          </section>

          {/* ══════════════════════════════════════════════════════════
              9. FOOTER
          ══════════════════════════════════════════════════════════ */}
          <footer className="bg-forest-deep text-cream border-t border-gold/20 pt-16 pb-8">
            {/* Logo centre */}
            <div className="flex justify-center mb-12">
              <IsharaLogo size="lg" />
            </div>

            <div className="max-w-6xl mx-auto px-6 lg:px-10 grid grid-cols-1 md:grid-cols-3 gap-10 pb-12 border-b border-gold/10">
              {/* Brand */}
              <div>
                <p className="font-serif italic text-sm text-cream/60 max-w-xs leading-relaxed">
                  "A gesture. A garment. A story." — An exploration of old-world silhouettes and hand-loomed textiles, crafted for those who carry heritage forward.
                </p>
                <div className="flex gap-4 mt-6">
                  {["Instagram","Pinterest","WhatsApp"].map(s => (
                    <span key={s} className="text-[10px] uppercase tracking-widest text-gold/60 hover:text-gold cursor-pointer font-sans font-semibold transition-colors">{s}</span>
                  ))}
                </div>
              </div>

              {/* Links */}
              <div>
                <h4 className="font-serif text-gold tracking-wider mb-5 font-semibold">Quick Inquiries</h4>
                <div className="flex flex-col gap-3 font-sans text-xs text-cream/50">
                  {[["#collections","Catalog Overview"],["#story","Karigar Lineages"],["#quiz","Fabric Consultation"],["#customise","Sizing & Alterations"]].map(([href, label]) => (
                    <a key={label} href={href} className="hover:text-gold transition-colors">{label}</a>
                  ))}
                </div>
              </div>

              {/* Newsletter */}
              <div>
                <h4 className="font-serif text-gold tracking-wider mb-5 font-semibold">Join the Circle</h4>
                <p className="font-sans text-xs text-cream/50 mb-4 leading-relaxed">Receive whispers of new collections and block print profiles.</p>
                <div className="flex border border-gold/25 bg-forest/50">
                  <input type="email" placeholder="Your email" className="bg-transparent px-3 py-2.5 text-xs outline-none w-full text-cream placeholder-cream/30 font-sans"/>
                  <button onClick={() => triggerToast("You are now in the circle.")} className="bg-gold hover:bg-gold-light text-forest-deep px-4 text-[10px] font-bold uppercase tracking-widest font-sans transition-colors whitespace-nowrap">
                    Join
                  </button>
                </div>
              </div>
            </div>

            {/* Bottom bar */}
            <div className="max-w-6xl mx-auto px-6 lg:px-10 pt-8 flex flex-col sm:flex-row justify-between items-center gap-3 text-[10px] text-cream/30 font-sans tracking-wider uppercase">
              <span>© {new Date().getFullYear()} ISHARA Apparels. All rights reserved.</span>
              <span className="text-gold/60 font-serif text-xs not-italic">Made with love in India 🇮🇳</span>
            </div>
          </footer>

          {/* ══════════════════════════════════════════════════════════
              CART DRAWER
          ══════════════════════════════════════════════════════════ */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-charcoal/60 backdrop-blur-sm fade-in">
              <div className="absolute inset-0 cursor-pointer" onClick={() => setIsCartOpen(false)}/>
              <div className="relative w-full max-w-md bg-cream h-full flex flex-col shadow-2xl border-l border-gold/20 z-10">
                <div className="flex justify-between items-center px-6 py-5 border-b border-gold/15">
                  <h3 className="font-serif text-xl text-forest font-semibold">Your Circle ({cart.length})</h3>
                  <button onClick={() => setIsCartOpen(false)} className="text-charcoal/50 hover:text-forest text-2xl" aria-label="Close">×</button>
                </div>

                <div className="flex-1 overflow-y-auto p-6">
                  {cart.length === 0 ? (
                    <div className="py-20 text-center">
                      <span className="text-4xl">🌾</span>
                      <p className="font-serif italic text-forest/50 mt-4 text-sm">Your circle is empty. Find fabrics that echo.</p>
                      <button onClick={() => { setIsCartOpen(false); }} className="mt-5 bg-forest text-cream text-[10px] uppercase font-bold tracking-widest px-6 py-2.5 font-sans hover:bg-forest-deep">
                        Explore Collection
                      </button>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      {cart.map(item => (
                        <div key={item.key} className="flex gap-4 border border-gold/15 p-3 bg-white relative">
                          <div className={`w-16 h-20 ${item.pat} flex-shrink-0 border border-gold/10`}/>
                          <div className="flex-grow flex flex-col justify-between">
                            <div>
                              <h4 className="font-serif text-sm font-semibold text-forest">{item.name}</h4>
                              <p className="text-[10px] text-charcoal/50 font-sans mt-0.5">{item.fabric}</p>
                            </div>
                            <div className="flex items-center justify-between mt-2">
                              <div className="flex items-center border border-gold/20 text-[11px]">
                                <button onClick={() => updateQty(item.key,-1)} className="px-2 py-0.5 hover:text-forest">-</button>
                                <span className="px-2 py-0.5 font-bold font-sans">{item.quantity}</span>
                                <button onClick={() => updateQty(item.key, 1)} className="px-2 py-0.5 hover:text-forest">+</button>
                              </div>
                              <span className="font-sans text-xs font-bold text-charcoal">₹{(item.price * item.quantity).toLocaleString("en-IN")}</span>
                            </div>
                          </div>
                          <button onClick={() => removeFromCart(item.key)} className="absolute top-2 right-2 text-charcoal/40 hover:text-maroon text-base" aria-label="Remove">×</button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="px-6 py-5 border-t border-gold/15">
                    <div className="flex justify-between items-center mb-4">
                      <span className="font-serif text-forest font-semibold">Total</span>
                      <span className="font-sans text-lg font-bold text-forest">₹{cartTotal.toLocaleString("en-IN")}</span>
                    </div>
                    <p className="text-[9px] text-charcoal/40 font-sans mb-4">✦ Complimentary alterations included. Ships twice weekly from Rajasthan.</p>
                    <button onClick={() => { triggerToast("Moving to checkout…"); setCart([]); setIsCartOpen(false); }}
                      className="w-full bg-forest hover:bg-forest-deep text-cream py-3.5 text-[11px] font-bold uppercase tracking-widest font-sans transition-colors">
                      Checkout
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ══════════════════════════════════════════════════════════
              WISHLIST DRAWER
          ══════════════════════════════════════════════════════════ */}
          {isWishOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-charcoal/60 backdrop-blur-sm fade-in">
              <div className="absolute inset-0 cursor-pointer" onClick={() => setIsWishOpen(false)}/>
              <div className="relative w-full max-w-md bg-cream h-full flex flex-col shadow-2xl border-l border-gold/20 z-10">
                <div className="flex justify-between items-center px-6 py-5 border-b border-gold/15">
                  <h3 className="font-serif text-xl text-forest font-semibold">Wishlist ({wishlist.length})</h3>
                  <button onClick={() => setIsWishOpen(false)} className="text-charcoal/50 hover:text-forest text-2xl" aria-label="Close">×</button>
                </div>
                <div className="flex-1 overflow-y-auto p-6">
                  {wishlist.length === 0 ? (
                    <div className="py-20 text-center">
                      <span className="text-4xl">🕊</span>
                      <p className="font-serif italic text-forest/50 mt-4 text-sm">No dreams saved yet. Gather your motifs here.</p>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      {PRODUCTS.filter(p => wishlist.includes(p.id)).map(item => (
                        <div key={item.id} className="flex gap-4 border border-gold/15 p-3 bg-white relative">
                          <div className={`w-16 h-20 ${item.pat} flex-shrink-0 border border-gold/10`}/>
                          <div className="flex-grow flex flex-col justify-between">
                            <div>
                              <h4 className="font-serif text-sm font-semibold text-forest">{item.name}</h4>
                              <p className="text-[10px] text-charcoal/50 font-sans mt-0.5">{item.fabric}</p>
                            </div>
                            <div className="flex items-center justify-between mt-2">
                              <span className="font-sans text-xs font-bold text-charcoal">₹{item.price.toLocaleString("en-IN")}</span>
                              <button onClick={() => { addToCart(item); toggleWish(item.id); }} className="text-[9px] bg-forest text-cream px-3 py-1 uppercase tracking-wider font-sans font-bold hover:bg-forest-deep">
                                Add to Cart
                              </button>
                            </div>
                          </div>
                          <button onClick={() => toggleWish(item.id)} className="absolute top-2 right-2 text-charcoal/40 hover:text-maroon text-base" aria-label="Remove">×</button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ══════════════════════════════════════════════════════════
              QUICK LOOK MODAL
          ══════════════════════════════════════════════════════════ */}
          {quickLook && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-charcoal/70 backdrop-blur-sm p-4 fade-in">
              <div className="absolute inset-0 cursor-pointer" onClick={() => setQuickLook(null)}/>
              <div className="relative w-full max-w-2xl bg-cream border border-gold/30 shadow-2xl z-10 flex flex-col md:flex-row overflow-hidden">
                {/* Close */}
                <button onClick={() => setQuickLook(null)} className="absolute top-4 right-4 text-forest hover:text-maroon text-2xl font-bold z-20 leading-none" aria-label="Close">×</button>
                {/* Swatch */}
                <div className={`w-full md:w-1/2 min-h-[280px] md:min-h-full ${quickLook.pat} border-b md:border-b-0 md:border-r border-gold/10 relative`}>
                  <div className="absolute bottom-3 left-3 bg-forest/90 text-gold text-[9px] uppercase tracking-widest px-2 py-0.5 border border-gold/20">
                    {quickLook.fabric}
                  </div>
                </div>
                {/* Details */}
                <div className="w-full md:w-1/2 p-8 flex flex-col justify-between">
                  <div>
                    <p className="text-[10px] uppercase tracking-widest text-forest/50 font-sans font-bold">{quickLook.tag}</p>
                    <h3 className="font-display text-2xl text-forest mt-1">{quickLook.name}</h3>
                    <p className="font-sans text-xl font-bold text-charcoal mt-1">₹{quickLook.price.toLocaleString("en-IN")}</p>
                    <div className="w-8 h-px bg-gold my-4"/>
                    <p className="font-serif italic text-sm text-forest/70 leading-relaxed">"{quickLook.desc}"</p>
                    <div className="mt-4 bg-cream-warm p-3 border border-gold/15 text-[11px] text-charcoal/70 font-sans space-y-1">
                      <p><strong>Fabric:</strong> {quickLook.fabric}</p>
                      <p><strong>Care:</strong> {quickLook.specs}</p>
                    </div>
                  </div>
                  <div className="flex gap-3 mt-6">
                    <button onClick={() => { addToCart(quickLook); setQuickLook(null); }}
                      className="flex-1 bg-forest hover:bg-forest-deep text-cream py-3 text-[11px] uppercase tracking-widest font-sans font-bold transition-colors">
                      Add to Cart
                    </button>
                    <button onClick={() => toggleWish(quickLook.id)}
                      className={`p-3 border transition-colors ${wishlist.includes(quickLook.id) ? "border-gold bg-gold/10 text-gold" : "border-gold/30 text-charcoal/60 hover:border-gold hover:text-gold"}`}
                      aria-label="Wishlist">
                      <svg className="w-4 h-4" fill={wishlist.includes(quickLook.id) ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                      </svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
