      85% { opacity: 0.07; }

    @keyframes driftThree {

      20% { opacity: 0.08; }
      80% { opacity: 0.08; }
      100% { transform: translate(80px, -200px) rotate(60deg); opacity: 0; }

    }

    }

          } else {
            setIsScrolled(false);
          }
        };
        window.addEventListener("scroll", handleScroll);
        return () => window.removeEventListener("scroll", handleScroll);
      }, []);

      // Trigger standard notification toast
      const triggerToast = (message) => {
        setToast(message);
        setTimeout(() => setToast(null), 3000);
      };

      const addToCart = (product, size = "Balanced & Graceful") => {
        const itemKey = `${product.id}-${size}`;
        const existing = cart.find(item => item.key === itemKey);
        
        if (existing) {
          setCart(cart.map(item => item.key === itemKey ? { ...item, quantity: item.quantity + 1 } : item));
        } else {
          setCart([...cart, { ...product, size, quantity: 1, key: itemKey }]);
        }
        triggerToast(`Added ${product.name} (${size}) to your circle.`);
      };

      // Remove from Cart
      const removeFromCart = (itemKey) => {
        setCart(cart.filter(item => item.key !== itemKey));
        triggerToast("Removed item from circle.");
      };

      // Update Cart Quantity
      const updateQty = (itemKey, amount) => {
        setCart(cart.map(item => {
          if (item.key === itemKey) {
            const nextQty = item.quantity + amount;
            return { ...item, quantity: nextQty > 0 ? nextQty : 1 };
          }
          return item;
        }));
      };

      // Toggle Wishlist
      const toggleWishlist = (productId) => {
        if (wishlist.includes(productId)) {
          setWishlist(wishlist.filter(id => id !== productId));
          triggerToast("Removed from Whispered Wishlist.");
        } else {
          setWishlist([...wishlist, productId]);
          triggerToast("Carried to Whispered Wishlist.");
        }
      };

      // Quiz Navigation & Logic
      const handleQuizOption = (step, val) => {
        setQuizAnswers({ ...quizAnswers, [step]: val });
        if (step === 'step1') setCurrentQuizStep(2);
        if (step === 'step2') setCurrentQuizStep(3);
        if (step === 'step3') setQuizFinished(true);

      const resetQuiz = () => {

        const pref = quizAnswers.step2;
        if (pref && pref.includes("Mulmul")) return { fabric: "Pure Mulmul", matches: PRODUCTS.filter(p => p.fabric.includes("Mulmul")) };
        if (pref && pref.includes("Cotton")) return { fabric: "Pure Cotton", matches: PRODUCTS.filter(p => p.fabric.includes("Cotton") || p.fabric.includes("Khadi")) };
        if (pref && pref.includes("Silk")) return { fabric: "Pure Silk", matches: PRODUCTS.filter(p => p.fabric.includes("Silk")) };

        return { fabric: "Pure Mulmul", matches: PRODUCTS.slice(0, 3) }; // Fallback
      };

      // Customisation Form Submit

            </div>
          )}

        </div>
      );
    }

    // Mount to the standard React DOM root
    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
